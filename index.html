<script>
/* ================= DATA ================= */
const SCHOOL_NAME=(typeof APP_SCHOOL_NAME!=="undefined"&&APP_SCHOOL_NAME)||"My School";
const SECTIONS=["A","B"];
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const sb=(typeof SUPABASE_URL!=="undefined"&&SUPABASE_URL&&!SUPABASE_URL.includes("YOUR-PROJECT"))?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let appData={currentUser:null,settings:{schoolName:SCHOOL_NAME},students:[],teachers:[],accounts:[],announcements:[],attendance:{},teacherAttendance:{},assignments:[],marks:[],
 gradeList:["Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6","Grade 7","Grade 8","Grade 9","Grade 10","Grade 11","Grade 12"],
 subjectsCatalog:{
  "Grade 1":["English","Urdu","Mathematics","General Knowledge"],
  "Grade 2":["English","Urdu","Mathematics","General Science"],
  "Grade 3":["English","Urdu","Mathematics","Science","Islamiyat"],
  "Grade 4":["English","Urdu","Mathematics","Science","Social Studies"],
  "Grade 5":["English","Urdu","Mathematics","General Science","Computer Studies"],
  "Grade 6":["English","Urdu","Mathematics","General Science","History & Geography"],
  "Grade 7":["English","Urdu","Mathematics","Science","Computer Studies","Islamiyat"],
  "Grade 8":["English","Urdu","Mathematics","Physics/Chem Intro","Computer","History"],
  "Grade 9":["English","Urdu","Mathematics","Physics","Chemistry","Biology/Computer","Islamiyat"],
  "Grade 10":["English","Urdu","Mathematics","Physics","Chemistry","Biology/Computer","Pakistan Studies"],
  "Grade 11":["English","Urdu","Mathematics","Physics (Grade 11)","Chemistry (Grade 11)","Computer Science"],
  "Grade 12":["Physics (Grade 12)","Mathematics (Grade 12)","English (Grade 12)","Chemistry (Grade 12)","Pakistan Studies","Computer Science"]
 }
};

/* ---------- DATABASE LAYER (Supabase) ----------
   The screens keep using appData. saveData() compares appData with the last
   copy from the server and sends only the changes. The database security
   rules (RLS) decide what each role is really allowed to change. */
const M={
 students:{to:s=>({id:s.id,name:s.name,father_name:s.fatherName,cnic:s.cnic,grade:s.grade,section:s.section||"A",photo:s.photo||null}),from:r=>({id:r.id,name:r.name,fatherName:r.father_name||"",cnic:r.cnic||"",grade:r.grade,section:r.section||"A",photo:r.photo||""})},
 teachers:{to:t=>({id:t.id,name:t.name,father_name:t.fatherName||"",cnic:t.cnic||"",assigned_subjects:t.assignedSubjects||[],class_teacher_of:t.classTeacherOf||""}),from:r=>({id:r.id,name:r.name,fatherName:r.father_name||"",cnic:r.cnic||"",assignedSubjects:r.assigned_subjects||[],classTeacherOf:r.class_teacher_of||""})},
 accounts:{to:a=>({id:a.id,record_id:a.recordId,name:a.name,role:a.role,email:a.email,status:a.status||"Active"}),from:r=>({id:r.id,recordId:r.record_id,name:r.name,role:r.role,email:r.email,status:r.status})},
 announcements:{to:a=>({id:a.id,title:a.title,date:a.date,content:a.content}),from:r=>({id:r.id,title:r.title,date:r.date,content:r.content})},
 assignments:{to:a=>({id:a.id,grade:a.grade,section:a.section,subject:a.subject,teacher_id:a.teacherId,day:a.day,start_time:a.start,end_time:a.end}),from:r=>({id:r.id,grade:r.grade,section:r.section,subject:r.subject,teacherId:r.teacher_id,day:r.day,start:r.start_time,end:r.end_time})},
 marks:{to:m=>({id:m.id,student_id:m.studentId,subject:m.subject,exam_title:m.examTitle,obtained:m.obtained,total:m.total}),from:r=>({id:r.id,studentId:r.student_id,subject:r.subject,examTitle:r.exam_title,obtained:Number(r.obtained),total:Number(r.total)})}
};
const attRows=(o,col)=>{const out=[];for(const d in o)for(const id in o[d])out.push({date:d,[col]:id,status:o[d][id]});return out};
const attNest=(rows,col)=>{const o={};rows.forEach(r=>{(o[r.date]=o[r.date]||{})[r[col]]=r.status});return o};
// w = roles allowed to write this table (the database enforces it too)
const SYNC=[
 {n:"students",t:"students",pk:["id"],w:["Admin"],rows:()=>appData.students.map(M.students.to)},
 {n:"teachers",t:"teachers",pk:["id"],w:["Admin"],rows:()=>appData.teachers.map(M.teachers.to)},
 {n:"accounts",t:"accounts",pk:["id"],w:["Admin"],rows:()=>appData.accounts.map(M.accounts.to)},
 {n:"announcements",t:"announcements",pk:["id"],w:["Admin"],rows:()=>appData.announcements.map(M.announcements.to)},
 {n:"assignments",t:"assignments",pk:["id"],w:["Admin"],rows:()=>appData.assignments.map(M.assignments.to)},
 {n:"marks",t:"marks",pk:["id"],w:["Admin","Teacher"],rows:()=>appData.marks.map(M.marks.to)},
 {n:"sa",t:"student_attendance",pk:["date","student_id"],w:["Admin","Teacher"],rows:()=>attRows(appData.attendance,"student_id")},
 {n:"ta",t:"teacher_attendance",pk:["date","teacher_id"],w:["Admin"],rows:()=>attRows(appData.teacherAttendance,"teacher_id")}
];
let snap={},syncQ=Promise.resolve();
const rowKey=(c,r)=>c.pk.map(p=>r[p]).join("|");
const takeSnap=()=>SYNC.forEach(c=>snap[c.n]=new Map(c.rows().map(r=>[rowKey(c,r),r])));
async function syncToServer(){
 const role=appData.currentUser&&appData.currentUser.role;if(!role||!sb)return;
 for(const c of SYNC){
  if(!c.w.includes(role))continue;
  const cur=new Map(c.rows().map(r=>[rowKey(c,r),r])),old=snap[c.n]||new Map(),ins=[],upd=[];
  const del=[...old.keys()].filter(k=>!cur.has(k));
  cur.forEach((r,k)=>{if(!old.has(k))ins.push(r);else if(JSON.stringify(old.get(k))!==JSON.stringify(r))upd.push(r)});
  for(const k of del){let q=sb.from(c.t).delete();c.pk.forEach(p=>q=q.eq(p,old.get(k)[p]));const{error}=await q;if(error)throw error}
  if(ins.length){const{error}=await sb.from(c.t).insert(ins);if(error)throw error}
  for(const r of upd){let q=sb.from(c.t).update(r);c.pk.forEach(p=>q=q.eq(p,r[p]));const{error}=await q;if(error)throw error}
  snap[c.n]=cur;
 }
}
function saveData(){
 syncQ=syncQ.then(syncToServer).catch(async e=>{
  console.error(e);showToast("Not saved: "+(e.message||e),"error");
  try{await loadRemote();takeSnap();RENDERERS[curView]&&RENDERERS[curView]();icons()}catch(x){console.error(x)}
 });
}
async function getAll(t,order=["id"]){
 let out=[],from=0;
 for(;;){let q=sb.from(t).select("*");order.forEach(c=>q=q.order(c));
  const{data,error}=await q.range(from,from+999);if(error)throw error;
  out=out.concat(data);if(data.length<1000)break;from+=1000}
 return out;
}
async function loadRemote(){
 const role=appData.currentUser.role;
 const [st,as,an,mk,sa]=await Promise.all([getAll("students"),getAll("assignments"),getAll("announcements"),getAll("marks"),getAll("student_attendance",["date","student_id"])]);
 appData.students=st.map(M.students.from);appData.assignments=as.map(M.assignments.from);
 appData.announcements=an.map(M.announcements.from).sort((a,b)=>b.id-a.id);
 appData.marks=mk.map(M.marks.from);appData.attendance=attNest(sa,"student_id");
 if(role==="Admin"){
  const [te,ac,ta]=await Promise.all([getAll("teachers"),getAll("accounts"),getAll("teacher_attendance",["date","teacher_id"])]);
  appData.teachers=te.map(M.teachers.from);appData.accounts=ac.map(M.accounts.from);appData.teacherAttendance=attNest(ta,"teacher_id");
 }else{
  const names=await getAll("teacher_names");
  let te=names.map(r=>({id:r.id,name:r.name,fatherName:"",cnic:"",assignedSubjects:[],classTeacherOf:""}));
  if(role==="Teacher"){(await getAll("teachers")).forEach(r=>{const m=M.teachers.from(r),i=te.findIndex(x=>x.id===r.id);if(i>-1)te[i]=m;else te.push(m)})}
  appData.teachers=te;appData.accounts=[];appData.teacherAttendance={};
 }
}
async function startSession(user,expected){
 const{data:p,error}=await sb.from("profiles").select("role,record_id,name").eq("id",user.id).maybeSingle();
 if(error||!p)throw new Error("No school profile found for this account. Ask the administrator.");
 if(expected&&p.role!==expected)throw new Error(`This account is not a ${expected}. Please choose the correct role.`);
 appData.currentUser={role:p.role,id:p.record_id,name:p.name};
 await loadRemote();takeSnap();initApp();
}

/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
const icons=()=>{try{lucide.createIcons()}catch(e){}};
const initials=n=>String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const INP="w-full px-4 py-2.5 bg-blueTint border border-blueBorder rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-royalBlue";
const BTN="px-5 py-2.5 bg-royalBlue hover:bg-blueHover text-white font-bold rounded-xl shadow-md transition-all text-sm flex items-center justify-center gap-2";
const CARD="bg-white rounded-2xl shadow-sm border border-blueBorder";
const LBL="block text-xs font-bold uppercase text-royalBlue mb-1";
const gNum=g=>parseInt(String(g).replace(/\D/g,""))||0;
const classLabel=(g,s)=>`Class ${gNum(g)}-${s}`;
const keyOf=(g,s)=>`${g}|${s}`;
const labelOfKey=k=>{const[g,s]=k.split("|");return classLabel(g,s)};
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const fmtT=a=>`${a.start}–${a.end}`;
const gradeOf=p=>p>=80?"A+":p>=70?"A":p>=60?"B":p>=50?"C":"F";
const tName=id=>(appData.teachers.find(t=>t.id===id)||{name:"Unknown"}).name;
const me=()=>{const u=appData.currentUser;if(!u)return null;if(u.role==="Admin")return u;
 const r=(u.role==="Teacher"?appData.teachers:appData.students).find(x=>x.id===u.id);return r?{...r,role:u.role}:u};
const sortKeys=ks=>ks.sort((a,b)=>{const[g1,s1]=a.split("|"),[g2,s2]=b.split("|");return gNum(g1)-gNum(g2)||s1.localeCompare(s2)});
const allClassKeys=()=>{const set=new Set();appData.students.forEach(s=>set.add(keyOf(s.grade,s.section||"A")));appData.assignments.forEach(a=>set.add(keyOf(a.grade,a.section)));return sortKeys([...set])};
const asgSort=(a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||toMin(a.start)-toMin(b.start);
const teacherAsg=id=>appData.assignments.filter(a=>a.teacherId===id).sort(asgSort);
// Grades a teacher is connected to: from saved assignments + legacy class-teacher value (kept, not deleted)
const teacherGrades=t=>{const s=new Set(teacherAsg(t.id).map(a=>a.grade));if(t.classTeacherOf)s.add(t.classTeacherOf);return s};
const teacherStudents=t=>{const ks=new Set(teacherAsg(t.id).map(a=>keyOf(a.grade,a.section)));return appData.students.filter(s=>ks.has(keyOf(s.grade,s.section||"A"))||(t.classTeacherOf&&s.grade===t.classTeacherOf))};
const attPct=(store,id)=>{let p=0,t=0;for(const d in store){const s=store[d][id];if(s){t++;if(s==="Present")p++}}return t?Math.round(p/t*100):null};
const empty=(msg,icon="inbox")=>`<div class="p-8 text-center text-slate-500 font-semibold text-sm"><i data-lucide="${icon}" class="w-8 h-8 mx-auto mb-2 text-royalBlue opacity-60"></i>${msg}</div>`;
const tableWrap=(head,rows,minW=600)=>`<div class="${CARD} overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-left border-collapse" style="min-width:${minW}px"><thead><tr class="bg-blueTint text-royalBlue text-xs uppercase font-poppins">${head.map(h=>`<th class="p-3 sm:p-4 whitespace-nowrap">${h}</th>`).join("")}</tr></thead><tbody class="divide-y divide-blueBorder text-sm">${rows}</tbody></table></div></div>`;
const pill=t=>`<span class="px-3 py-1 bg-blueSoft text-royalBlue font-bold text-xs rounded-full whitespace-nowrap">${esc(t)}</span>`;
const iconBtn=(fn,icon,danger)=>`<button onclick="${fn}" class="p-2 ${danger?"bg-red-50 hover:bg-red-500 text-red-500":"bg-blueTint hover:bg-royalBlue text-royalBlue"} hover:text-white rounded-xl transition-all" aria-label="${icon}"><i data-lucide="${icon}" class="w-4 h-4"></i></button>`;
const avatar=(p,size="w-16 h-16 text-2xl")=>p.photo?`<img src="${esc(p.photo)}" class="${size.split(" ")[0]} ${size.split(" ")[1]} rounded-2xl object-cover flex-shrink-0" alt="">`:`<div class="${size} bg-white text-royalBlue rounded-2xl flex items-center justify-center font-extrabold shadow-inner flex-shrink-0">${esc(p.name.charAt(0).toUpperCase())}</div>`;

function showToast(msg,type="success"){
 const c=$("toast-container"),t=document.createElement("div");
 t.className=`px-5 py-3 rounded-2xl shadow-xl text-white text-xs font-bold transition-all transform translate-y-2 opacity-0 flex items-center gap-2 self-end ${type==="success"?"bg-royalBlue":"bg-red-500"}`;
 t.innerHTML=`<i data-lucide="${type==="success"?"check-circle":"alert-circle"}" class="w-4 h-4 flex-shrink-0"></i><span>${esc(msg)}</span>`;
 c.appendChild(t);icons();
 setTimeout(()=>t.classList.remove("translate-y-2","opacity-0"),50);
 setTimeout(()=>{t.classList.add("translate-y-2","opacity-0");setTimeout(()=>t.remove(),300)},3500);
}

/* ================= AUTH ================= */
$("login-form").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!sb)return showToast("Database not configured. Edit config.js first.","error");
 const role=$("login-role").value,idf=$("login-identifier").value.trim(),pw=$("login-password").value,btn=$("login-btn");
 const email=idf.includes("@")?idf.toLowerCase():`${idf.toLowerCase()}@school.local`;
 btn.disabled=true;btn.classList.add("opacity-60");
 try{
  const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error)throw new Error(/invalid login credentials/i.test(error.message)?"Invalid ID or password.":error.message);
  try{await startSession(data.user,role);showToast(`Welcome back, ${appData.currentUser.name}!`)}
  catch(err){await sb.auth.signOut();throw err}
 }catch(err){showToast(err.message,"error")}

// subjects for a student's class + teacher from saved assignments
function subjectRows(s){
 const sec=s.section||"A",names=new Set(appData.subjectsCatalog[s.grade]||[]);
 appData.assignments.filter(a=>a.grade===s.grade&&a.section===sec).forEach(a=>names.add(a.subject));
 return [...names].map(sub=>{
  const a=appData.assignments.find(x=>x.grade===s.grade&&x.section===sec&&x.subject===sub);
  let teacher=a?tName(a.teacherId):null;
  if(!teacher){const t=appData.teachers.find(t=>(t.assignedSubjects||[]).some(x=>x===sub||x===`${sub} (${s.grade})`));teacher=t?t.name:"To be assigned"}
  return {subject:sub,teacher};
 });
}

function fillSubjects(sel){
 const g=$("tt-grade").value;
 $("tt-sub").innerHTML=(appData.subjectsCatalog[g]||[]).map(s=>`<option ${s===sel?"selected":""}>${esc(s)}</option>`).join("");
}
function ttError(m){const b=$("tt-msg");b.textContent=m;b.classList.remove("hidden");showToast(m,"error")}
function ttConflict(a,ex){
 const others=appData.assignments.filter(x=>x.id!==ex&&x.day===a.day&&toMin(a.start)<toMin(x.end)&&toMin(x.start)<toMin(a.end));
 const cc=others.find(x=>x.grade===a.grade&&x.section===a.section);
 if(cc)return `${a.day}: ${classLabel(a.grade,a.section)} already has ${cc.subject} at ${fmtT(cc)}.`;
 const tc=others.find(x=>x.teacherId===a.teacherId);
 if(tc)return `${a.day}: ${tName(a.teacherId)} is already teaching ${classLabel(tc.grade,tc.section)} at ${fmtT(tc)}.`;
 return null;
}
function saveAssignment(e){
 e.preventDefault();$("tt-msg").classList.add("hidden");
 const a={grade:$("tt-grade").value,section:$("tt-sec").value,subject:$("tt-sub").value,teacherId:$("tt-tch").value,day:$("tt-day").value,start:$("tt-start").value,end:$("tt-end").value};
 if(!a.grade||!a.section||!a.subject||!a.teacherId||!a.day||!a.start||!a.end)return ttError("Please complete all required fields.");
 if(!appData.teachers.some(t=>t.id===a.teacherId))return ttError("Selected teacher does not exist.");
 if(!(appData.subjectsCatalog[a.grade]||[]).includes(a.subject))return ttError("Selected subject is not available for this grade.");
 if(toMin(a.end)<=toMin(a.start))return ttError("End time must be later than start time.");
 const all=a.day==="ALL";
 if(all&&ttEditId)return ttError("To edit, choose one single day. 'All Days' is only for creating new assignments.");
 const days=all?DAYS:[a.day];
 for(const d of days){const err=ttConflict({...a,day:d},ttEditId);if(err)return ttError(err+(all?" Nothing was saved.":""))}
 if(ttEditId){const i=appData.assignments.findIndex(x=>x.id===ttEditId);appData.assignments[i]={...appData.assignments[i],...a}}
 else days.forEach((d,n)=>appData.assignments.push({id:"ASG-"+Date.now()+"-"+n,...a,day:d}));
 saveData();
 const keys=allClassKeys();$("tt-filter").innerHTML=keys.map(k=>`<option value="${k}">${labelOfKey(k)}</option>`).join("");$("tt-filter").value=keyOf(a.grade,a.section);
 const wasEdit=!!ttEditId;resetTTForm();renderTTTable();showToast(wasEdit?"Assignment updated!":all?`Saved for all ${days.length} days!`:"Assignment saved!");
}
function resetTTForm(){ttEditId=null;$("tt-form").reset();fillSubjects();$("tt-form-title").innerText="Assign Teacher, Subject & Period";$("tt-cancel").classList.add("hidden");$("tt-msg").classList.add("hidden")}
function editAssignment(id){
 const a=appData.assignments.find(x=>x.id===id);if(!a)return;ttEditId=id;
 $("tt-grade").value=a.grade;$("tt-sec").value=a.section;fillSubjects(a.subject);$("tt-sub").value=a.subject;
 $("tt-tch").value=a.teacherId;$("tt-day").value=a.day;$("tt-start").value=a.start;$("tt-end").value=a.end;
 $("tt-form-title").innerText="Edit Assignment";$("tt-cancel").classList.remove("hidden");
 $("main-area").scrollTo({top:0,behavior:"smooth"});
}
function deleteAssignment(id){if(!confirm("Remove this assignment from the timetable?"))return;appData.assignments=appData.assignments.filter(a=>a.id!==id);saveData();if(ttEditId===id)resetTTForm();renderTTTable();showToast("Assignment removed","error")}
function renderTTTable(){

 $("tt-table").innerHTML=list.length?tableWrap(["Day","Time","Class","Subject","Teacher","Actions"],list.map(a=>`<tr class="hover:bg-blueTint"><td class="p-3 sm:p-4 font-bold text-royalBlue">${a.day}</td><td class="p-3 sm:p-4 whitespace-nowrap font-semibold">${fmtT(a)}</td><td class="p-3 sm:p-4">${pill(classLabel(a.grade,a.section))}</td><td class="p-3 sm:p-4 font-semibold">${esc(a.subject)}</td><td class="p-3 sm:p-4">${esc(tName(a.teacherId))}</td><td class="p-3 sm:p-4 text-right whitespace-nowrap space-x-2">${iconBtn(`editAssignment('${a.id}')`,"edit")}${iconBtn(`deleteAssignment('${a.id}')`,"trash-2",true)}</td></tr>`).join(""),700)
  :`<div class="${CARD}">${empty("No assignments for this class yet. Use the form above to create one.","calendar-x")}</div>`;
 icons();
}

  ${isAdmin?`<div class="inline-flex rounded-xl bg-blueTint p-1 border border-blueBorder gap-1 self-start"><button id="tab-teacher" onclick="setAttMode('teacher')" class="px-4 py-2 rounded-lg text-xs font-bold">Teacher Attendance</button><button id="tab-student" onclick="setAttMode('student')" class="px-4 py-2 rounded-lg text-xs font-bold">Student Attendance</button></div>`:""}

function setAttMode(m){attMode=m;attDraft={};renderAttBody()}
function onAttDate(v){attDate=v;attDraft={};renderAttBody()}
const statusBadge=s=>`<span class="px-3 py-1 rounded-full text-xs font-bold text-white ${s==="Present"?"bg-royalBlue":s==="Absent"?"bg-red-500":"bg-amber-500"}">${s}</span>`;
function attList(){

 if(attMode==="teacher")return {list:appData.teachers,store:appData.teacherAttendance};
 return {list:u.role==="Teacher"?teacherStudents(u):appData.students,store:appData.attendance};
}
// Rules: no default status. Teacher marks students once, then it is locked for the teacher.
// Admin marks teachers, can edit saved teacher + student records, but cannot mark students.
function renderAttBody(){
 const role=me().role,isT=attMode==="teacher",{list,store}=attList();
 $("att-title").innerText=isT?"Teacher Attendance Register":"Student Attendance Register";
 $("att-sub").innerText=isT?"Administrator marks teacher attendance and can edit it later.":(role==="Teacher"?"Only students of your classes are shown.":"Attendance entered by teachers. You can edit saved records.");
 $("att-note").innerText=role==="Teacher"?"P = Present, A = Absent, L = Leave. Once you save, you cannot edit it. Only the administrator can edit it.":isT?"P = Present, A = Absent, L = Leave. After saving, you can still edit teacher attendance.":"Teachers mark student attendance. You can edit saved records here, but you cannot mark new ones.";
 if($("tab-teacher")){["teacher","student"].forEach(m=>$("tab-"+m).className=`px-4 py-2 rounded-lg text-xs font-bold transition-all ${attMode===m?"bg-royalBlue text-white shadow-sm":"text-slate-600 hover:text-royalBlue"}`)}
 $("att-save-btn").classList.toggle("hidden",role==="Admin"&&!isT);
 if(!list.length){$("att-body").innerHTML=`<div class="${CARD}">${empty(isT?"No teachers found. Add teachers in Teacher Management.":role==="Teacher"?"No students found. You have no assigned or class-teacher classes yet.":"No students found.","users")}</div>`;icons();return}
 const day=store[attDate]||{};
 const btn=(id,cur,s,lbl,on)=>`<button type="button" title="${s}" onclick="setAtt('${id}','${s}')" class="w-10 px-2 py-1.5 rounded-lg text-xs font-bold transition-all ${cur===s?on+" text-white shadow-sm":"text-slate-600 hover:text-royalBlue"}">${lbl}</button>`;
 const rows=list.map(p=>{
  const rec=day[p.id],cur=rec||attDraft[p.id]||null,pct=attPct(store,p.id);
  let ctl;
  if(role==="Teacher"&&rec)ctl=`${statusBadge(rec)} <i data-lucide="lock" class="inline w-4 h-4 text-slate-400"></i>`;
  else if(role==="Admin"&&!isT&&!rec)ctl=`<span class="text-xs italic text-slate-400">Not marked by teacher</span>`;
  else ctl=`<div class="inline-flex rounded-xl bg-blueTint p-1 border border-blueBorder gap-1">${btn(p.id,cur,"Present","P","bg-royalBlue")}${btn(p.id,cur,"Absent","A","bg-red-500")}${btn(p.id,cur,"Leave","L","bg-amber-500")}</div>`;
  return `<tr class="hover:bg-blueTint"><td class="p-3 sm:p-4 font-bold text-royalBlue">${esc(p.id)}</td><td class="p-3 sm:p-4 font-semibold">${esc(p.name)}</td>
  <td class="p-3 sm:p-4">${isT?(pct!==null?pct+"%":"—"):pill(classLabel(p.grade,p.section||"A"))}</td><td class="p-3 sm:p-4 text-center">${ctl}</td></tr>`}).join("");
 const cnt={Present:[],Absent:[],Leave:[],None:[]};list.forEach(p=>cnt[day[p.id]||"None"].push(p));
 const col=(k,c,ic,lbl)=>`<div class="bg-${c}-50/60 p-4 rounded-2xl border border-${c}-200 space-y-2"><div class="flex items-center justify-between"><h4 class="font-bold text-xs uppercase text-${c}-700 flex items-center gap-1.5"><i data-lucide="${ic}" class="w-4 h-4"></i>${lbl}</h4><span class="px-2 py-0.5 bg-${c}-600 text-white font-bold text-xs rounded-full">${cnt[k].length}</span></div>${cnt[k].length?cnt[k].map(p=>`<div class="p-2 bg-white rounded-lg border border-${c}-200 text-xs font-semibold flex justify-between gap-2"><span class="truncate">${esc(p.name)}</span><span class="text-[10px] font-bold">${esc(p.id)}</span></div>`).join(""):`<p class="text-[11px] text-slate-400 italic">None</p>`}</div>`;
 $("att-body").innerHTML=tableWrap(["ID",isT?"Teacher Name":"Student Name",isT?"Overall %":"Class","Status (P / A / L)"],rows,620)+`<div class="${CARD} p-4 sm:p-6"><h3 class="font-bold font-poppins text-royalBlue text-sm mb-3">Saved summary for ${attDate}</h3><div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">${col("Present","green","check-circle","Present")}${col("Absent","red","x-circle","Absent")}${col("Leave","amber","clock","Leave")}${col("None","slate","minus-circle","Not marked")}</div></div>`;

function setAtt(id,status){
 const role=me().role,{store}=attList(),has=store[attDate]&&store[attDate][id];
 if(has){
  if(role==="Teacher")return showToast("Already saved. Only the administrator can edit it.","error");
  store[attDate][id]=status;saveData();showToast("Attendance updated");
 }else{
  if(role==="Admin"&&attMode==="student")return;
  attDraft[id]=status;
 }
 renderAttBody();
}
function saveAtt(){
 const role=me().role,{list,store}=attList(),d=store[attDate]||{},pend=list.filter(p=>!d[p.id]);
 if(!pend.length)return showToast(role==="Teacher"?"This register is already saved and locked.":"All records are already saved. Use P / A / L to edit.","error");
 const miss=pend.filter(p=>!attDraft[p.id]);
 if(miss.length)return showToast(`Please mark everyone first (${miss.length} remaining).`,"error");
 if(role==="Teacher"&&!confirm("After saving you cannot edit this attendance. Only the administrator can. Save now?"))return;
 const t=store[attDate]=store[attDate]||{};pend.forEach(p=>t[p.id]=attDraft[p.id]);
 attDraft={};saveData();renderAttBody();showToast("Attendance saved successfully!");
}

/* ================= MARKS & RESULTS ================= */
function marksForRole(){
 const u=me();
 if(u.role==="Student")return appData.marks.filter(m=>m.studentId===u.id);
 if(u.role==="Teacher"){const ids=new Set(teacherStudents(u).map(s=>s.id));return appData.marks.filter(m=>ids.has(m.studentId))}
 return appData.marks;
}
function renderMarks(){
 const u=me(),v=$("view-marks");
 if(u.role==="Student"){
  const my=marksForRole(),ob=my.reduce((a,m)=>a+m.obtained,0),tt=my.reduce((a,m)=>a+m.total,0),rp=tt?Math.round(ob/tt*100):null;
  v.innerHTML=`<div class="${CARD} p-5 flex items-center gap-4"><div class="w-14 h-14 bg-blueTint text-royalBlue rounded-2xl flex items-center justify-center"><i data-lucide="award" class="w-7 h-7"></i></div><div><p class="text-xs font-bold text-slate-400 uppercase">Overall Result</p><h3 class="text-2xl font-bold font-poppins text-royalBlue">${rp!==null?rp+"% ("+gradeOf(rp)+")":"No results yet"}</h3></div></div>
  ${my.length?tableWrap(["Subject","Exam","Obtained","Maximum","Percentage","Grade"],my.map(m=>markCells(m,false)).join(""),620):`<div class="${CARD}">${empty("No results published yet.","award")}</div>`}`;
  icons();return;
 }
 const all=marksForRole(),exams=[...new Set(all.map(m=>m.examTitle))],subs=[...new Set(all.map(m=>m.subject))];
 v.innerHTML=`<div class="${CARD} p-4 sm:p-6 space-y-4"><div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
  <div><h2 class="text-lg font-bold font-poppins text-royalBlue">Examination & Marks Management</h2><p class="text-xs text-slate-500">Results are grouped class by class.</p></div>
  <button onclick="openMarkModal()" class="${BTN}"><i data-lucide="plus-circle" class="w-5 h-5"></i>Add Exam Result</button></div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3"><input id="mk-search" oninput="renderMarksBody()" placeholder="Search student name or ID..." class="${INP}">
  <select id="mk-exam" onchange="renderMarksBody()" class="${INP}"><option value="">All examinations</option>${exams.map(x=>`<option>${esc(x)}</option>`).join("")}</select>
  <select id="mk-sub" onchange="renderMarksBody()" class="${INP}"><option value="">All subjects</option>${subs.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div></div><div id="mk-body" class="space-y-6"></div>`;
 renderMarksBody();
}
function markCells(m,withStudent){
 const st=appData.students.find(s=>s.id===m.studentId)||{name:"Unknown"};
 const p=m.total?Math.round(m.obtained/m.total*100):0;
 const g=`<span class="px-3 py-1 rounded-full text-xs font-bold text-white ${p>=50?"bg-royalBlue":"bg-red-500"}">${gradeOf(p)}</span>`;
 const isAdminT=me().role!=="Student";
 return withStudent?`<tr class="hover:bg-blueTint"><td class="p-3 sm:p-4 font-bold text-royalBlue">${esc(m.studentId)}</td><td class="p-3 sm:p-4 font-semibold">${esc(st.name)}</td><td class="p-3 sm:p-4">${esc(m.subject)}</td><td class="p-3 sm:p-4 text-slate-600">${esc(m.examTitle)}</td><td class="p-3 sm:p-4 text-right font-semibold">${m.obtained}</td><td class="p-3 sm:p-4 text-right">${m.total}</td><td class="p-3 sm:p-4 text-right font-bold text-royalBlue">${p}%</td><td class="p-3 sm:p-4">${g}</td><td class="p-3 sm:p-4 text-right">${iconBtn(`deleteMark(${m.id})`,"trash-2",true)}</td></tr>`
  :`<tr class="hover:bg-blueTint"><td class="p-3 sm:p-4 font-semibold">${esc(m.subject)}</td><td class="p-3 sm:p-4 text-slate-600">${esc(m.examTitle)}</td><td class="p-3 sm:p-4 font-semibold">${m.obtained}</td><td class="p-3 sm:p-4">${m.total}</td><td class="p-3 sm:p-4 font-bold text-royalBlue">${p}%</td><td class="p-3 sm:p-4">${g}</td></tr>`;
}
function renderMarksBody(){
 const q=$("mk-search").value.toLowerCase(),ex=$("mk-exam").value,sb=$("mk-sub").value;
 const groups={};
 marksForRole().forEach(m=>{
  const s=appData.students.find(x=>x.id===m.studentId);if(!s)return;
  if(q&&!(s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q)))return;
  if(ex&&m.examTitle!==ex)return;if(sb&&m.subject!==sb)return;
  (groups[keyOf(s.grade,s.section||"A")]=groups[keyOf(s.grade,s.section||"A")]||[]).push(m);
 });
 const keys=sortKeys(Object.keys(groups));
 $("mk-body").innerHTML=keys.length?keys.map(k=>`<div class="space-y-2"><h3 class="font-bold font-poppins text-royalBlue flex items-center gap-2"><i data-lucide="graduation-cap" class="w-5 h-5"></i>${labelOfKey(k)} — Marks & Results</h3>
  ${tableWrap(["Student ID","Student Name","Subject","Exam","Obtained Marks","Maximum Marks","Percentage","Grade","Actions"],groups[k].map(m=>markCells(m,true)).join(""),900)}</div>`).join("")
  :`<div class="${CARD}">${empty("No result records match the current filters.","award")}</div>`;
 icons();
}
function openMarkModal(){
 const u=me(),studs=u.role==="Teacher"?teacherStudents(u):appData.students;
 if(!studs.length)return showToast("No students available.","error");
 openModal(modalHead("Add Exam Result")+`<form onsubmit="saveMark(event)" class="p-5 sm:p-6 space-y-4">
  <div><label class="${LBL}">Student</label><select id="m-mark-student" onchange="fillMarkSubjects()" class="${INP}">${studs.map(s=>`<option value="${s.id}">${esc(s.name)} (${classLabel(s.grade,s.section||"A")})</option>`).join("")}</select></div>
  <div><label class="${LBL}">Subject</label><select id="m-mark-subject" class="${INP}"></select></div>
  <div><label class="${LBL}">Exam Title</label><input id="m-mark-title" required placeholder="e.g. Mid-Term" class="${INP}"></div>
  <div class="grid grid-cols-2 gap-4"><div><label class="${LBL}">Obtained</label><input type="number" id="m-mark-obt" required min="0" class="${INP}"></div><div><label class="${LBL}">Maximum</label><input type="number" id="m-mark-tot" required min="1" value="50" class="${INP}"></div></div>
  <button class="${BTN} w-full">Save Exam Result</button></form>`);
 fillMarkSubjects();
}
function fillMarkSubjects(){
 const u=me(),s=appData.students.find(x=>x.id===$("m-mark-student").value);
 let subs=appData.subjectsCatalog[s.grade]||[];
 if(u.role==="Teacher"){const mine=new Set(teacherAsg(u.id).filter(a=>a.grade===s.grade).map(a=>a.subject));(u.assignedSubjects||[]).forEach(x=>mine.add(x));const f=subs.filter(x=>mine.has(x));if(f.length)subs=f}
 $("m-mark-subject").innerHTML=subs.map(x=>`<option>${esc(x)}</option>`).join("");
}
function saveMark(e){
 e.preventDefault();
 const obtained=parseFloat($("m-mark-obt").value),total=parseFloat($("m-mark-tot").value);
 if(obtained>total)return showToast("Obtained marks cannot exceed maximum marks.","error");
 appData.marks.push({id:Date.now(),studentId:$("m-mark-student").value,subject:$("m-mark-subject").value,examTitle:$("m-mark-title").value.trim(),obtained,total});
 saveData();closeModal();renderMarks();showToast("Exam result recorded successfully!");
}
function deleteMark(id){if(!confirm("Delete this result record?"))return;appData.marks=appData.marks.filter(m=>m.id!==id);saveData();renderMarksBody();showToast("Exam record removed","error")}

/* ================= ACCOUNTS ================= */
function renderAccounts(){
 $("view-accounts").innerHTML=`<div class="${CARD} p-4 sm:p-6 space-y-4"><div class="border-b border-blueBorder pb-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
  <div><h2 class="text-xl font-bold font-poppins text-royalBlue flex items-center gap-2"><i data-lucide="key" class="w-6 h-6"></i>Account Management Portal</h2><p class="text-xs text-slate-500 mt-1">Create and manage login credentials for students and teachers.</p></div>
  <button onclick="openAccountModal()" class="${BTN}"><i data-lucide="user-plus" class="w-5 h-5"></i>Create Login Account</button></div>
  ${tableWrap(["User ID","Full Name","Role","Email","Status","Actions"],appData.accounts.map(a=>`<tr class="hover:bg-blueTint"><td class="p-3 sm:p-4 font-bold text-royalBlue">${esc(a.recordId)}</td><td class="p-3 sm:p-4 font-semibold">${esc(a.name)}</td><td class="p-3 sm:p-4">${pill(a.role)}</td><td class="p-3 sm:p-4 text-slate-600">${esc(a.email)}</td><td class="p-3 sm:p-4"><span class="px-3 py-1 bg-green-100 text-green-700 font-bold text-xs rounded-full">${a.status}</span></td><td class="p-3 sm:p-4 text-right">${iconBtn(`deleteAccount('${a.id}')`,"trash-2",true)}</td></tr>`).join(""),700)}</div>`;
 icons();
}
function openAccountModal(){
 openModal(modalHead("Create Login Account")+`<form onsubmit="saveAccount(event)" class="p-5 sm:p-6 space-y-4">
  <div><label class="${LBL}">Account Type</label><select id="m-acc-role" onchange="updateAccPeople()" class="${INP}"><option>Student</option><option>Teacher</option></select></div>
  <div><label class="${LBL}">Person</label><select id="m-acc-person" onchange="updateAccEmail()" class="${INP}"></select></div>
  <div><label class="${LBL}">Login Email</label><input type="email" id="m-acc-email" required readonly class="${INP} bg-slate-100 cursor-not-allowed"><p class="text-xs text-slate-500 mt-1">Created automatically from the ID. The user logs in with this email or just the ID.</p></div>
  <div><label class="${LBL}">Initial Password</label><input type="password" id="m-acc-pass" required class="${INP}"></div>
  <button class="${BTN} w-full">Create Account</button></form>`);
 updateAccPeople();
}
function updateAccEmail(){
 const id=$("m-acc-person").value;
 $("m-acc-email").value=id?`${String(id).toLowerCase()}@school.local`:"";
}
function updateAccPeople(){
 const r=$("m-acc-role").value;
 $("m-acc-person").innerHTML=r==="Student"?appData.students.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.id} - ${classLabel(s.grade,s.section||"A")})</option>`).join(""):appData.teachers.map(t=>`<option value="${t.id}">${esc(t.name)} (${t.id})</option>`).join("");
 updateAccEmail();
}
async function api(body){
 const{data:{session}}=await sb.auth.getSession();
 const r=await fetch("/api/manage-user",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify(body)});
 const txt=await r.text();let j={};try{j=JSON.parse(txt)}catch(e){}
 if(!r.ok){const e=new Error(j.error||`Server error ${r.status}: ${txt.slice(0,150)}`);e.status=r.status;throw e}
 return j;
}
// Uses the Vercel function; if the site has no /api (404) it uses the database function instead.
async function manageUser(body){
 try{return await api(body)}
 catch(err){
  if(err.status!==404)throw err;
  const create=body.action==="create";
  const{error}=await sb.rpc(create?"admin_create_user":"admin_delete_user",create?{p_role:body.role,p_record_id:body.recordId,p_password:body.password}:{p_role:body.role,p_record_id:body.recordId});
  if(error)throw new Error(error.message);
  return{ok:true};
 }
}
async function saveAccount(e){
 e.preventDefault();
 const role=$("m-acc-role").value,recordId=$("m-acc-person").value,email=`${String(recordId).toLowerCase()}@school.local`,password=$("m-acc-pass").value;
 if(appData.accounts.some(a=>a.email===email))return showToast("Email already linked to an account.","error");
 if(appData.accounts.some(a=>a.recordId===recordId))return showToast("An account already exists for this person.","error");
 if(password.length<6)return showToast("Password must be at least 6 characters.","error");
 const rec=(role==="Student"?appData.students:appData.teachers).find(x=>x.id===recordId);if(!rec)return;
 try{await manageUser({action:"create",role,recordId,password})}catch(err){return showToast(err.message,"error")}
 appData.accounts.push({id:"ACC-"+Date.now(),recordId,name:rec.name,role,email,status:"Active"});
 saveData();closeModal();renderAccounts();showToast(`Account created. Login ID: ${recordId} (${email})`);
}
async function dropAccountFor(recordId,role){
 const a=appData.accounts.find(x=>x.recordId===recordId&&x.role===role);if(!a)return;
 try{await manageUser({action:"delete",role,recordId});appData.accounts=appData.accounts.filter(x=>x!==a)}
 catch(e){showToast("Login account not removed: "+e.message,"error")}
}
async function deleteAccount(id){
 const a=appData.accounts.find(x=>x.id===id);if(!a)return;
 if(a.role==="Admin")return showToast("The administrator account cannot be deleted here.","error");
 if(!confirm("Delete this login account?"))return;
 try{await manageUser({action:"delete",role:a.role,recordId:a.recordId})}catch(err){return showToast(err.message,"error")}
 appData.accounts=appData.accounts.filter(x=>x.id!==id);saveData();renderAccounts();showToast("Account deleted","error");
}

/* ================= REPORTS ================= */
function renderReports(){
 $("view-reports").innerHTML=`<div class="${CARD} p-4 sm:p-6 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4"><div><h2 class="text-lg font-bold font-poppins text-royalBlue">Institutional Reports & Analytics</h2><p class="text-xs text-slate-500">Print or export official student records.</p></div>
  <div class="flex flex-col sm:flex-row gap-3"><button onclick="window.print()" class="${BTN}"><i data-lucide="printer" class="w-5 h-5"></i>Print Report</button><button onclick="exportCSV()" class="px-5 py-2.5 bg-white text-royalBlue border border-blueBorder hover:bg-blueTint font-bold rounded-xl text-sm flex items-center justify-center gap-2"><i data-lucide="download" class="w-5 h-5"></i>Export CSV</button></div></div>
  <div class="${CARD} p-4 sm:p-8 space-y-6"><div class="text-center border-b border-blueBorder pb-6"><h2 class="text-xl sm:text-2xl font-bold font-poppins text-royalBlue">${esc(appData.settings.schoolName)} - Official Summary</h2><p class="text-xs text-slate-500 mt-1">Generated by ${esc(me().name)}</p></div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${[["Students",appData.students.length],["Teachers",appData.teachers.length],["Login Accounts",appData.accounts.length],["Exam Records",appData.marks.length]].map(x=>`<div class="p-4 bg-blueTint rounded-2xl border border-blueBorder text-center"><p class="text-xs font-bold text-slate-400 uppercase">${x[0]}</p><h3 class="text-xl font-bold font-poppins text-royalBlue mt-1">${x[1]}</h3></div>`).join("")}</div></div>`;
 icons();
}
function exportCSV(){
 let csv="ID,Name,Father Name,CNIC,Grade,Section\n";
 appData.students.forEach(s=>{csv+=`"${s.id}","${s.name}","${s.fatherName}","${s.cnic}","${s.grade}","${s.section||"A"}"\n`});
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="SmartSchool_Students_Report.csv";a.click();showToast("CSV report exported!");
}

/* ================= MODAL ================= */
function openModal(html){const b=$("modal-backdrop"),x=$("modal-box");x.innerHTML=html;b.classList.remove("hidden");setTimeout(()=>x.classList.remove("scale-95","opacity-0"),30);icons()}
function closeModal(){const b=$("modal-backdrop"),x=$("modal-box");x.classList.add("scale-95","opacity-0");setTimeout(()=>b.classList.add("hidden"),200)}
$("modal-backdrop").addEventListener("click",e=>{if(e.target.id==="modal-backdrop")closeModal()});

window.addEventListener("DOMContentLoaded",async()=>{
 icons();
 if(!sb){showToast("Database not configured. Edit config.js first.","error");return}
 const{data:{session}}=await sb.auth.getSession();
 if(session){try{await startSession(session.user)}catch(e){await sb.auth.signOut();showToast(e.message,"error")}}
});
</script>
